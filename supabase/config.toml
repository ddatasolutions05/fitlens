# Supabase CLI project config. `supabase link` fills project_id.
project_id = "fitlens"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:8081", "fitlens://"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.analyze-meal]
verify_jwt = true
import_map = "./functions/import_map.json"

[functions.read-label]
verify_jwt = true
import_map = "./functions/import_map.json"

[functions.lookup-barcode]
verify_jwt = true
import_map = "./functions/import_map.json"

[functions.features]
verify_jwt = true
import_map = "./functions/import_map.json"

[functions.export-data]
verify_jwt = true
import_map = "./functions/import_map.json"

[functions.delete-account]
verify_jwt = true
import_map = "./functions/import_map.json"

[functions.track-visit]
# Visitors are mostly anonymous; the function reads a user token itself when one is sent.
verify_jwt = false
import_map = "./functions/import_map.json"

[functions.weekly-summary]
# Same schedule secret as send-reminders; a signed-in test request carries a user token.
verify_jwt = false
import_map = "./functions/import_map.json"

[functions.send-reminders]
# The schedule calls it with a shared secret; a signed-in test request carries a user token.
verify_jwt = false
import_map = "./functions/import_map.json"
