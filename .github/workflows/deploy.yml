name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Export web build
        run: npx expo export --platform web --output-dir dist
        working-directory: apps/mobile
        env:
          CI: '1'
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          EXPO_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.EXPO_PUBLIC_VAPID_PUBLIC_KEY }}
          # Drops unused exports; cuts the web bundle by about a quarter.
          EXPO_UNSTABLE_TREE_SHAKING: '1'
          EXPO_UNSTABLE_METRO_OPTIMIZE_GRAPH: '1'
      # A tab opened before this deploy still asks for the previous build's chunks.
      # Keep the last build's static files next to the new ones so it keeps working.
      - name: Restore the previous build's chunks
        uses: actions/cache/restore@v4
        with:
          path: previous-static
          key: web-static-${{ github.sha }}
          restore-keys: web-static-
      - name: Merge previous chunks into this build
        run: |
          if [ -d previous-static ]; then
            cp -rn previous-static/. apps/mobile/dist/_expo/static/ || true
          fi
          rm -rf previous-static
          mkdir -p previous-static
          cp -r apps/mobile/dist/_expo/static/. previous-static/
      - name: Save this build's chunks for the next deploy
        uses: actions/cache/save@v4
        with:
          path: previous-static
          key: web-static-${{ github.sha }}
      - name: Sub-path asset links and SPA fallback
        run: |
          sed -i 's#href="/manifest.webmanifest"#href="/${{ github.event.repository.name }}/manifest.webmanifest"#; s#href="/icons/#href="/${{ github.event.repository.name }}/icons/#' apps/mobile/dist/index.html
          cp apps/mobile/dist/index.html apps/mobile/dist/404.html
          touch apps/mobile/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
